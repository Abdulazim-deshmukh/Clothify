{% extends 'Base.html' %}
{% block title %}Clothify | Create Account{% endblock %}
{% block container %}
<section class="auth-section"><div class="container auth-wrap"><div class="auth-card">
    <div class="auth-heading"><span class="eyebrow dark">JOIN CLOTHIFY</span><h1>Create your account</h1><p>Save your details and make your next order easier.</p></div>
    <form method="POST" action="{% url 'customer' %}" class="form-grid">{% csrf_token %}
        <div class="form-group full"><label for="customername">Full name</label><input id="customername" name="customername" type="text" required></div>
        <div class="form-group"><label for="customeremailId">Email address</label><input id="customeremailId" name="customeremailId" type="email" required></div>
        <div class="form-group"><label for="customerphonenumber">Phone number</label><input id="customerphonenumber" name="customerphonenumber" type="tel"></div>
        <div class="form-group full"><label for="customeraddress">Address</label><textarea id="customeraddress" name="customeraddress" rows="3"></textarea></div>
        <div class="form-group full"><label for="customerpassword">Password</label><input id="customerpassword" name="customerpassword" type="password" minlength="6" required><small>Use at least 6 characters.</small></div>
        <button class="btn btn-dark full-btn full" type="submit">Create account</button>
    </form>
    <p class="auth-footer">Already have an account? <a href="{% url 'login' %}">Login</a></p>
</div></div></section>
{% endblock %}
