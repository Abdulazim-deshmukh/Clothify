{% extends 'Base.html' %}
{% block title %}Clothify | Login{% endblock %}
{% block container %}
<section class="auth-section"><div class="container auth-wrap"><div class="auth-card auth-card-small">
    <div class="auth-heading"><span class="eyebrow dark">WELCOME BACK</span><h1>Login</h1><p>Access your Clothify account or admin dashboard.</p></div>
    <form method="POST" action="{% url 'login' %}" class="form-grid">{% csrf_token %}
        <div class="form-group full"><label for="customeremailId">Email address</label><input id="customeremailId" name="customeremailId" type="email" required></div>
        <div class="form-group full"><label for="customerpassword">Password</label><input id="customerpassword" name="customerpassword" type="password" required></div>
        <button class="btn btn-dark full-btn full" type="submit">Login</button>
    </form>
    <p class="auth-footer">New to Clothify? <a href="{% url 'register' %}">Create an account</a></p>
</div></div></section>
{% endblock %}
