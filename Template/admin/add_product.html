{% extends 'Base.html' %}
{% block title %}Clothify | Add Product{% endblock %}
{% block container %}
<section class="admin-header"><div class="container"><span class="eyebrow dark">CATALOGUE</span><h1>Add product</h1><p>Create a new product for the storefront.</p></div></section>
<section class="section section-tight"><div class="container narrow-form"><div class="form-card"><form method="POST" action="{% url 'product' %}" enctype="multipart/form-data" class="form-grid">{% csrf_token %}<div class="form-group full"><label>Product name</label><input name="productname" maxlength="50" required></div><div class="form-group full"><label>Description</label><textarea name="productdescription" rows="4" maxlength="200" required></textarea></div><div class="form-group"><label>Price (₹)</label><input name="productprice" type="number" min="0" step="0.01" required></div><div class="form-group"><label>Product image</label><input name="product_image" type="file" accept="image/*"></div><div class="button-row full"><button class="btn btn-dark" type="submit">Add product</button><a class="btn btn-light" href="{% url 'productlist_admin' %}">Cancel</a></div></form></div></div></section>
{% endblock %}
