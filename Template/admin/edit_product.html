{% extends 'Base.html' %}
{% block title %}Clothify | Edit Product{% endblock %}
{% block container %}
<section class="admin-header"><div class="container"><span class="eyebrow dark">CATALOGUE</span><h1>Edit product</h1><p>Update product information and pricing.</p></div></section>
<section class="section section-tight"><div class="container narrow-form"><div class="form-card"><form method="POST" action="{% url 'dataupdateproduct' %}" enctype="multipart/form-data" class="form-grid">{% csrf_token %}<input type="hidden" name="productId" value="{{ product.productId }}"><div class="form-group full"><label>Product name</label><input name="productname" maxlength="50" value="{{ product.productname }}" required></div><div class="form-group full"><label>Description</label><textarea name="productdescription" rows="4" maxlength="200" required>{{ product.productdescription }}</textarea></div><div class="form-group"><label>Price (₹)</label><input name="productprice" type="number" min="0" step="0.01" value="{{ product.productprice }}" required></div><div class="form-group"><label>Replace image</label><input name="product_image" type="file" accept="image/*"></div>{% if product.product_image %}<div class="current-image full"><span>Current image</span><img src="{{ product.product_image.url }}" alt="{{ product.productname }}"></div>{% endif %}<div class="button-row full"><button class="btn btn-dark" type="submit">Save changes</button><a class="btn btn-light" href="{% url 'productlist_admin' %}">Cancel</a></div></form></div></div></section>
{% endblock %}
